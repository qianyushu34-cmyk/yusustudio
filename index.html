            const [isMouseInHero, setIsMouseInHero] = useState(false);

            };

            useEffect(() => {
                if (!containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                
                setRelativePos({
                    x: mousePos.x - rect.left,
                    y: mousePos.y - rect.top
                });

                if (isMouseInHero) {
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const deltaX = mousePos.x - centerX;
                    const deltaY = mousePos.y - centerY;

                    const normX = Math.max(-1, Math.min(1, deltaX / (window.innerWidth / 2)));
                    const normY = Math.max(-1, Math.min(1, deltaY / (window.innerHeight / 2)));

                    setTilt({
                        x: -normY * 18, 
                        y: normX * 18   
                    });
                } else {
                    setTilt({ x: 0, y: 0 }); 
                }
            }, [mousePos, isMouseInHero]);

            useEffect(() => {
                let animationFrameId;
                const targetRadius = cursorType === 'lens' ? 120 : 0;
                
                const updateRadius = () => {
                    setClipRadius(prev => {
                        const diff = targetRadius - prev;
                        if (Math.abs(diff) < 0.1) return targetRadius;
                        return prev + diff * 0.15;
                    });
                    if (clipRadius !== targetRadius) {
                        animationFrameId = requestAnimationFrame(updateRadius);
                    }
                };

                updateRadius();
                return () => cancelAnimationFrame(animationFrameId);
            }, [cursorType]);

            const englishMaskStyle = cursorType === 'lens' ? {

                maskRepeat: 'no-repeat',
                WebkitMaskRepeat: 'no-repeat'
            } : {};

                    className="min-h-screen flex flex-col items-center justify-start text-center px-4 relative overflow-hidden pt-24 pb-12 md:pb-16"

                        setCursorType('default');
                    }}

                            onMouseLeave={() => setCursorType('default')}
                        >
                            {/* Upper layer (English text) */}
                            <div 
                                className="absolute text-5xl md:text-8xl font-extrabold tracking-tighter text-black/95 dark:text-white/95 text-center pointer-events-none w-full transition-colors duration-300"
                                style={{
                                    ...englishMaskStyle,
                                    transform: 'translateZ(30px)' 
                                }}
                            >

                                className="absolute text-4xl md:text-7xl font-extrabold tracking-tighter text-[#B8F500] text-center pointer-events-none w-full"

                                }}

                                    <span 
                                        key={i} 
                                        className="px-4 py-2 text-sm bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-full font-medium text-gray-700 dark:text-gray-300 transition-all hover:border-gray-400 dark:hover:border-gray-600"
                                        onMouseEnter={() => setCursorType('hover')}
                                        onMouseLeave={() => setCursorType('default')}
                                    >
                                        {spec}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* 核心工作流 */}
                    <div className="border-t border-gray-200 dark:border-gray-800 pt-10 mb-8">
                        <span className="text-xs font-mono text-gray-400 dark:text-gray-500 uppercase tracking-widest">{t.skills.workflowLabel}</span>
                    </div>

                    {/* 8个工作流网格 */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                        {t.skills.steps.map((item, idx) => (
                            <div key={idx} className="relative group/wf">
                                <div 
                                    className="w-full bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-xl p-3 flex items-center gap-3 hover:border-gray-400 dark:hover:border-[#B8F500]/50 hover:shadow-md dark:hover:shadow-[#B8F500]/5 transition-all duration-300"
                                    onMouseEnter={() => setCursorType('hover')}
                                    onMouseLeave={() => setCursorType('default')}
                                >
                                    <div className="w-10 h-10 shrink-0 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 flex items-center justify-center text-gray-600 dark:text-gray-300 group-hover/wf:text-[#B8F500] transition-colors">
                                        {getIcon(item.icon)}
                                    </div>
                                    <div className="flex flex-col justify-center">
                                        <span className="text-[10px] font-mono font-bold text-[#B8F500] uppercase tracking-wider mb-0.5 leading-none">{item.step}</span>
                                        <h3 className="text-[15px] font-bold text-black dark:text-white group-hover/wf:text-[#B8F500] transition-colors leading-tight">{item.title}</h3>
                                    </div>
                                </div>
                                {/* 桌面上连接卡片的小箭头 (每一行的最后一列不放，一共4列) */}
                                {(idx !== 3 && idx !== 7) && (
                                    <div className="hidden lg:flex absolute right-[-10px] top-1/2 -translate-y-1/2 w-5 h-5 rounded-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-[#111111] items-center justify-center z-20 text-gray-400 dark:text-gray-500 shadow-sm transition-colors group-hover/wf:border-[#B8F500]/30">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                            <polyline points="9 18 15 12 9 6" />
                                        </svg>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const SkillCard = ({ item, setCursorType }) => {
            return (
                <div 
                    className="group [perspective:1000px] h-64"
                    onMouseEnter={() => setCursorType('hover')}
                    onMouseLeave={() => setCursorType('default')}
                >
                    <div className="relative w-full h-full [transform-style:preserve-3d] transition-transform duration-700 ease-in-out group-hover:[transform:rotateY(180deg)]">
                        {/* Front */}
                        <div className="absolute w-full h-full [backface-visibility:hidden] bg-gray-50 dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 p-8 flex flex-col justify-between transition-colors">
                            <div>
                                <h3 className="text-3xl md:text-4xl font-bold text-black dark:text-white">{item.top}</h3>
                                {item.sub && <span className="text-xs text-gray-500 font-mono uppercase mt-1 block">{item.sub}</span>}
                            </div>
                            <div>
                                <h4 className="font-semibold text-lg text-black dark:text-white">{item.title}</h4>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">{item.desc}</p>
                            </div>
                        </div>
                        {/* Back */}
                        <div className="absolute w-full h-full [backface-visibility:hidden] [transform:rotateY(180deg)] bg-[#B8F500] border border-[#B8F500] text-black p-8 flex flex-col justify-center transition-colors shadow-xl">
                            <h4 className="font-semibold text-sm text-black/70 mb-4">{item.backTitle}</h4>
                            <div className="space-y-3">
                                {item.skillsList.map((skill, i) => (
                                    <div key={i}>
                                        <div className="flex justify-between text-xs mb-1 font-mono font-bold">
                                            <span>{skill.name}</span>
                                            <span>{skill.pct}</span>
                                        </div>
                                        <div className="w-full bg-black/20 rounded-full h-1.5">
                                            <div className="bg-black h-1.5 rounded-full" style={{ width: skill.pct }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const VisualExploration = ({ t, setCursorType }) => (
            <section id="visual" className="py-32 px-4 md:px-16 max-w-7xl mx-auto border-t border-gray-100 dark:border-gray-900 transition-colors">
                <div className="text-center mb-16">
                    <span className="text-xs font-mono text-gray-500 uppercase tracking-widest">{t.visual.label}</span>
                    <h2 
                        className="text-4xl font-bold mt-2 mb-4 inline-block text-black dark:text-white transition-colors"
                        onMouseEnter={() => setCursorType('hover')}
                        onMouseLeave={() => setCursorType('default')}
                    >
                        {t.visual.title}
                    </h2>
                    <p className="text-gray-500 dark:text-gray-400">{t.visual.subtitle}</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    {t.visual.items.map((item, idx) => <SkillCard key={idx} item={item} setCursorType={setCursorType} />)}
                </div>
            </section>
        );

        const MasonryProjectCard = ({ item, setCursorType }) => {
            return (
                <div 
                    className="relative w-full rounded-2xl overflow-hidden cursor-pointer group break-inside-avoid mb-3 md:mb-4 bg-gray-100 dark:bg-[#111111] border border-gray-200 dark:border-gray-800 transition-all duration-300 hover:scale-[1.02] hover:-translate-y-1 hover:z-10 hover:shadow-2xl dark:hover:shadow-[#B8F500]/10 hover:border-gray-400 dark:hover:border-gray-600"
                    onMouseEnter={() => setCursorType('hover')}
                    onMouseLeave={() => setCursorType('default')}
                >
                    <div className={`w-full ${item.height} relative overflow-hidden bg-gradient-to-br ${item.gradient}`}>
                        
                        {/* 预留图片层：当您有真实图片时，只需在 data 中填入 imgSrc 即可自动展示 */}
                        {item.imgSrc ? (
                            <img src={item.imgSrc} alt={item.title} className="absolute inset-0 w-full h-full object-cover" />
                        ) : (
                            /* 占位噪点层 (未来被真实图片覆盖) */
                            <div className="absolute inset-0 opacity-[0.15] mix-blend-overlay" style={{backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.65\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E")'}}></div>
                        )}

                        {/* 底部渐变遮罩，确保文字在任何图片上都清晰可见 */}
                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 group-hover:opacity-100 transition-opacity duration-500"></div>

                        {/* Top Left Tag */}
                        <div className="absolute top-3 left-3 z-10">
                            <span className="px-2.5 py-1 rounded-full text-[9px] md:text-[10px] font-medium bg-black/40 text-white/90 backdrop-blur-md border border-white/10 tracking-wide">
                                {item.tag}
                            </span>
                        </div>

                        {/* Bottom Left Text */}
                        <div className="absolute bottom-3 left-3 right-3 z-10 transform translate-y-1 group-hover:translate-y-0 transition-transform duration-300">
                            <h3 className="text-white font-bold text-sm md:text-base truncate leading-tight mb-0.5">{item.title}</h3>
                            <p className="text-gray-300 text-[9px] md:text-[10px] font-mono truncate opacity-70 group-hover:opacity-100 transition-opacity duration-300">{item.subtitle}</p>
                        </div>

                    </div>
                </div>
            );
        };

        const Projects = ({ t, setCursorType }) => {
            const [activeFilter, setActiveFilter] = useState("全部");
            
            const filteredItems = activeFilter === "全部" 
                ? t.projects.items 
                : t.projects.items.filter(item => item.tag === activeFilter);

            return (
                <section id="projects" className="py-24 md:py-32 px-4 md:px-10 max-w-[1600px] mx-auto border-t border-gray-100 dark:border-gray-900 transition-colors">
                    {/* Header Row */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-10 gap-6">
                        <div className="text-left">
                            <span className="text-[#B8F500] font-mono text-xs uppercase tracking-widest">{t.projects.label}</span>
                            <h2 
                                className="text-3xl md:text-5xl font-bold mt-2 mb-3 text-black dark:text-white transition-colors"
                                onMouseEnter={() => setCursorType('hover')}
                                onMouseLeave={() => setCursorType('default')}
                            >
                                {t.projects.title}<span className="text-[#B8F500]">。</span>
                            </h2>
                            <p className="text-gray-500 dark:text-gray-400 text-xs md:text-sm">{t.projects.subtitle}</p>
                        </div>

                        {/* Filter Buttons */}
                        <div className="flex flex-wrap gap-2">
                            {t.projects.filters.map((filter, i) => (
                                <button 
                                    key={i}
                                    onClick={() => setActiveFilter(filter)}
                                    className={`px-4 py-1.5 rounded-full text-xs font-medium transition-colors border ${
                                        activeFilter === filter 
                                        ? 'bg-[#B8F500] text-black border-[#B8F500]' 
                                        : 'bg-transparent text-gray-500 dark:text-gray-400 border-gray-200 dark:border-gray-800 hover:border-gray-400 dark:hover:border-gray-500'
                                    }`}
                                    onMouseEnter={() => setCursorType('hover')}
                                    onMouseLeave={() => setCursorType('default')}
                                >
                                    {filter}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* CSS Columns 实现的紧凑高级瀑布流 */}
                    <div className="columns-2 sm:columns-3 lg:columns-4 xl:columns-4 gap-3 md:gap-4 space-y-3 md:space-y-4">
                        {filteredItems.map((item, idx) => <MasonryProjectCard key={idx} item={item} setCursorType={setCursorType} />)}
                    </div>

                    {/* View More Button */}
                    <div className="mt-12 flex justify-center">
                        <button 
                            className="px-6 py-3 bg-transparent border border-gray-200 dark:border-gray-800 text-black dark:text-white rounded-full font-bold text-xs md:text-sm flex items-center justify-center gap-2 hover:border-[#B8F500] hover:text-[#B8F500] transition-colors"
                            onMouseEnter={() => setCursorType('hover')}
                            onMouseLeave={() => setCursorType('default')}
                        >
                            VIEW MORE WORKS
                            <div className="w-5 h-5 rounded-full bg-[#B8F500] text-black flex items-center justify-center">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </div>
                        </button>
                    </div>
                </section>
            );
        };

        const Footer = ({ t, setCursorType }) => (
            <footer className="py-32 px-4 md:px-16 max-w-6xl mx-auto border-t border-gray-200 dark:border-gray-800 transition-colors">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-24">
                    <div>
                        <span className="text-xs font-mono text-gray-500 uppercase tracking-widest">{t.footer.label}</span>
                        <h2 
                            className="text-5xl md:text-6xl font-bold mt-4 mb-4 tracking-tight text-black dark:text-white transition-colors"
                            onMouseEnter={() => setCursorType('hover')}
                            onMouseLeave={() => setCursorType('default')}
                        >
                            {t.footer.title}
                        </h2>
                        <p className="text-gray-500 dark:text-gray-400 text-lg transition-colors">{t.footer.subtitle}</p>
                    </div>
                    <button 
                        className="mt-8 md:mt-0 bg-black dark:bg-white text-white dark:text-black px-8 py-4 rounded-full font-bold hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors flex items-center gap-2"
                        onMouseEnter={() => setCursorType('hover')}
                        onMouseLeave={() => setCursorType('default')}
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        {t.footer.btn}
                    </button>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-8 border-t border-gray-200 dark:border-gray-800 pt-12 transition-colors">
                    {Object.entries(t.footer.info).map(([key, val]) => (
                        <div key={key}>
                            <h4 className="text-xs font-mono text-gray-400 dark:text-gray-600 uppercase mb-2 transition-colors">{key}</h4>
                            <p 
                                className="text-sm font-medium cursor-pointer text-gray-600 dark:text-gray-300 hover:text-black dark:hover:text-white transition-colors"
                                onMouseEnter={() => setCursorType('hover')}
                                onMouseLeave={() => setCursorType('default')}
                            >
                                {val}
                            </p>
                        </div>
                    ))}
                </div>
            </footer>
        );

        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [mousePos, setMousePos] = useState({ x: -100, y: -100 });
            const [cursorType, setCursorType] = useState('default'); // 'default' | 'hover' | 'lens'
            const [mouseInWindow, setMouseInWindow] = useState(true);
            const t = dictionary['zh']; 
            
            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    setMousePos({ x: e.clientX, y: e.clientY });
                };
                const handleMouseLeave = () => setMouseInWindow(false);
                const handleMouseEnter = () => setMouseInWindow(true);

                window.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseleave', handleMouseLeave);
                document.addEventListener('mouseenter', handleMouseEnter);

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseleave', handleMouseLeave);
                    document.removeEventListener('mouseenter', handleMouseEnter);
                };
            }, []);

            const CustomCursor = () => {
                if (!mouseInWindow) return null;

                let styles = {
                    transform: `translate3d(${mousePos.x}px, ${mousePos.y}px, 0) translate(-50%, -50%)`,
                    pointerEvents: 'none',
                    zIndex: 9999,
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    borderRadius: '50%',
                    willChange: 'transform, width, height, border, background-color'
                };

                if (cursorType === 'lens') {
                    return (
                        <div 
                            style={{
                                ...styles,
                                width: '240px',
                                height: '240px',
                                border: '1.5px solid #B8F500',
                                backgroundColor: 'rgba(184, 245, 0, 0.03)',
                                transition: 'width 0.25s cubic-bezier(0.25, 1, 0.5, 1), height 0.25s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease'
                            }}
                        />
                    );
                }

                if (cursorType === 'hover') {
                    return (
                        <div 
                            style={{
                                ...styles,
                                width: '80px',
                                height: '80px',
                                backgroundColor: '#ffffff',
                                mixBlendMode: 'difference',
                                transition: 'width 0.25s cubic-bezier(0.25, 1, 0.5, 1), height 0.25s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease'
                            }}
                        />
                    );
                }

                return (
                    <div 
                        style={{
                            ...styles,
                            width: '32px',
                            height: '32px',
                            backgroundColor: '#ffffff',
                            mixBlendMode: 'difference',
                            transition: 'width 0.25s cubic-bezier(0.25, 1, 0.5, 1), height 0.25s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease'
                        }}
                    />
                );
            };

            return (
                <div className="relative">
                    {/* 自定义动态光标 */}
                    <CustomCursor />
                    
                    <Navbar isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} t={t} setCursorType={setCursorType} />
                    <Hero t={t} isDarkMode={isDarkMode} mousePos={mousePos} cursorType={cursorType} setCursorType={setCursorType} />
                    <About setCursorType={setCursorType} />
                    <ComicProjects t={t} setCursorType={setCursorType} />
                    <Skills t={t} setCursorType={setCursorType} />
                    <Projects t={t} setCursorType={setCursorType} />
                    <VisualExploration t={t} setCursorType={setCursorType} />
                    <Footer t={t} setCursorType={setCursorType} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
